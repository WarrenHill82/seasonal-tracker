<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anime Seasonal Tracker</title>
  <link rel="stylesheet" href="/style.css?v=tags8" />
  <link rel="stylesheet" href="/compact.css?v=tags8" />
</head>
<body>
  <div id="app">
    <main id="board" class="board"></main>
    <footer class="statusbar" id="chrome">
      <nav class="ranges" id="ranges">
        <button type="button" data-range="today" class="active">Today</button>
        <button type="button" data-range="this_week">This week</button>
        <button type="button" data-range="next_week">Next week</button>
        <button type="button" data-range="week_after">Following</button>
        <button type="button" data-range="library">My shows</button>
      </nav>
      <div class="zoom-control main-zoom" id="main-zoom" role="group" aria-label="Card size">
        <button type="button" data-zoom="50" aria-label="50 percent card size" title="50%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1" /></svg></button>
        <button type="button" data-zoom="75" aria-label="75 percent card size" title="75%" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1" /></svg></button>
        <button type="button" data-zoom="100" aria-label="100 percent card size" title="100%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1" /></svg></button>
      </div>
      <div class="tools">
        <button type="button" id="btn-compact" hidden></button>
        <button type="button" id="btn-layout" class="icon-btn" aria-label="Bar / Row">
          <svg class="i-row" viewBox="0 0 20 20" width="16" height="16"><rect x="1" y="3" width="18" height="3" rx="1"/><rect x="1" y="8.5" width="18" height="3" rx="1"/><rect x="1" y="14" width="18" height="3" rx="1"/></svg>
          <svg class="i-bar" viewBox="0 0 20 20" width="16" height="16"><rect x="3" y="1" width="3" height="18" rx="1"/><rect x="8.5" y="1" width="3" height="18" rx="1"/><rect x="14" y="1" width="3" height="18" rx="1"/></svg>
        </button>
        <button type="button" id="btn-settings" class="icon-btn" aria-label="Settings">⚙</button>
        <button type="button" id="btn-notifications" class="icon-btn notify-btn" aria-label="Notifications">
          🔔
          <span id="notify-badge" class="notify-badge hidden" aria-hidden="true"></span>
        </button>
      </div>
    </footer>
  </div>
  <div id="panel-backdrop" class="panel-backdrop hidden" aria-hidden="true"></div>
  <aside id="drawer" class="drawer drawer-picker panel-window hidden">
    <div class="drawer-head"><h2 id="drawer-title">Add seasonal shows</h2><button type="button" id="drawer-close">Close</button></div>
    <div class="panel-content">
      <div class="picker-bar">
        <div id="season-select" class="select season-select"></div>
        <input id="search" type="search" placeholder="Search titles…" />
        <div class="seg" id="picker-layout"><button type="button" data-pick="tiles" class="active">Tiles</button><button type="button" data-pick="rows">Rows</button></div>
      </div>
      <div id="picker-grid" class="picker-grid tiles"></div>
      <div class="pager"><button type="button" id="page-prev">Prev</button><span id="page-info"></span><button type="button" id="page-next">Next</button></div>
    </div>
    <div class="zoom-control panel-zoom" id="picker-zoom" role="group" aria-label="Add shows content size">
      <button type="button" data-zoom="50" aria-label="50 percent content size" title="50%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1" /></svg></button>
      <button type="button" data-zoom="75" aria-label="75 percent content size" title="75%" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1" /></svg></button>
      <button type="button" data-zoom="100" aria-label="100 percent content size" title="100%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1" /></svg></button>
    </div>
  </aside>
  <aside id="settings" class="drawer drawer-settings panel-window hidden">
    <div class="drawer-head"><h2 id="settings-title">Widget settings</h2><button type="button" id="settings-close">Close</button></div>
    <form id="settings-form" class="settings-form">
      <button type="button" id="btn-add" class="primary">Add shows</button>
      <label>Theme<div class="select" data-name="theme"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="dark">Dark widget</li><li data-value="light">Light</li></ul><input type="hidden" name="theme" /></div></label>
      <label>Title language<div class="select" data-name="titleLanguage"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="english">English</li><li data-value="romaji">Romaji</li></ul><input type="hidden" name="titleLanguage" /></div></label>
      <label>Week starts<div class="select" data-name="weekStart"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="sunday">Sunday</li><li data-value="monday">Monday</li></ul><input type="hidden" name="weekStart" /></div></label>
      <button type="submit" class="primary">Save</button>
      <div class="reload-row"><button type="button" id="btn-reload-ui">Reload UI</button><button type="button" id="btn-reload-widget" class="primary">Reload widget</button></div>
    </form>
    <div class="zoom-control panel-zoom" id="settings-zoom" role="group" aria-label="Settings content size">
      <button type="button" data-zoom="50" aria-label="50 percent content size" title="50%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1" /></svg></button>
      <button type="button" data-zoom="75" aria-label="75 percent content size" title="75%" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1" /></svg></button>
      <button type="button" data-zoom="100" aria-label="100 percent content size" title="100%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1" /></svg></button>
    </div>
  </aside>
  <aside id="notify-panel" class="notify-panel panel-window hidden" aria-live="polite">
    <div class="notify-head">
      <h2 id="notify-title">Notifications</h2>
      <button type="button" id="notify-close">Close</button>
    </div>
    <div id="notify-list" class="notify-list"></div>
    <section class="notify-log-section" aria-label="Error log">
      <div class="notify-log-head">
        <strong>Error log</strong>
        <button type="button" id="notify-clear-log" title="Clear persisted errors">Clear log</button>
      </div>
      <pre id="notify-error-log" class="notify-error-log">Loading…</pre>
    </section>
    <div class="zoom-control panel-zoom" id="notify-zoom" role="group" aria-label="Notification content size">
      <button type="button" data-zoom="50" aria-label="50 percent content size" title="50%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1" /></svg></button>
      <button type="button" data-zoom="75" aria-label="75 percent content size" title="75%" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1" /></svg></button>
      <button type="button" data-zoom="100" aria-label="100 percent content size" title="100%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1" /></svg></button>
    </div>
  </aside>
  <aside id="show-details" class="drawer show-details panel-window hidden">
    <div class="drawer-head"><h2 id="details-title">Show details</h2><button type="button" id="show-details-close">Close</button></div>
    <div id="show-details-content" class="show-details-content"></div>
    <div class="zoom-control panel-zoom" id="details-zoom" role="group" aria-label="Details content size">
      <button type="button" data-zoom="50" aria-label="50 percent content size" title="50%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1" /></svg></button>
      <button type="button" data-zoom="75" aria-label="75 percent content size" title="75%" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1" /></svg></button>
      <button type="button" data-zoom="100" aria-label="100 percent content size" title="100%" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1" /></svg></button>
    </div>
  </aside>
  <div hidden><span id="range-label"></span><span id="season-chip"></span></div>
  <div id="toast" class="toast hidden"></div>
  <div id="hover-tip" class="hover-tip hidden"></div>
  <script src="/app.js?v=tags8"></script>
  <script src="/chrome.js?v=tags8"></script>
  <script src="/pills.js?v=tags8"></script>
  <script src="/count-fix.js?v=tags8"></script>
  <script src="/weeks.js?v=tags8"></script>
  <script src="/sort.js?v=tags8"></script>
  <script src="/week-fix.js?v=tags8"></script>
</body>
</html>
